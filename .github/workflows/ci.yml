name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: sólo los jobs que publican reciben permiso de escribir paquetes
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions')); console.log(f('statements'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Desde acá, sólo publica. Sin !cancelled() ni always(): si algo de arriba falló, no se llega.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso del job, a propósito: si los tests fallan el job muere antes y esto no corre.
      # Nombre en minúsculas a mano: github.repository trae mayúsculas y ghcr.io no las acepta.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/valentinml525/ingsoft3-tp01-backend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}   # el commit queda horneado: /api/health lo devuelve
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions')); console.log(f('statements'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/valentinml525/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}   # el commit queda horneado: /api/health lo devuelve
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # los PRs verifican; sólo main despliega
    permissions:
      contents: read                           # sólo baja el código (migraciones y smoke)
    environment:
      name: qa                                 # secrets (hooks, DATABASE_URL) y vars (URLs) de QA
      url: ${{ vars.URL_FRONT }}
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Bajar el código al runner (migraciones y smoke)
        uses: actions/checkout@v7

      # El esquema lo crean las migraciones de Prisma del repo, no el arranque de la app.
      # Antes del deploy: el código nuevo arranca contra una base que ya tiene su esquema.
      - name: Aplicar migraciones a la base de QA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes prisma@5.21.1 migrate deploy --schema prisma/schema.prisma

      # Render ya no construye: ejecuta la IMAGEN que publicó este mismo pipeline. El hook dice cuál
      # con imgURL (antes iba &ref=<commit>, que con una imagen no hay nada que construir).
      # --get --data-urlencode agrega el parámetro con & y codifica los ':' y '/' de la imagen;
      # la URL del hook va ÚLTIMA porque es el único argumento suelto del curl.
      - name: Desplegar en QA la IMAGEN del commit verificado (backend + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          IMG_API="ghcr.io/valentinml525/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/valentinml525/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test (espera a que QA corra este commit)
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
          COMMIT_ESPERADO: ${{ github.sha }}
        run: bash .github/scripts/smoke.sh

  # Integración: la API de QA (ya ejecutando la imagen de ESTA corrida) con su base de verdad.
  # Sin navegador y sin dobles. Va antes que la e2e: es más barata, y si la api está rota no vale
  # la pena levantar un browser para confirmarlo.
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                           # QA ya corre la imagen de esta corrida
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar (sin navegador)         # estas pruebas no abren browser
        run: npm ci

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://ingsoft3-tp01-qa.onrender.com      # la api de QA, no el front
          BACKEND_API_KEY: ${{ secrets.QA_BACKEND_API_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/api.spec.ts

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}                # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-integracion  # distinto del de e2e: dos iguales rompen la corrida
          path: playwright-report
          retention-days: 90

  # e2e: un navegador de verdad usando el front de QA completo (front + api + base).
  e2e:
    runs-on: ubuntu-latest
    needs: integracion                         # si la api está rota, no gastamos un browser en confirmarlo
    permissions:
      contents: read
    timeout-minutes: 20                       # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://miapp-front-qa-r825.onrender.com   # el front de QA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/unidades.spec.ts              # SU archivo: no vuelve a correr la integración

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: playwright-report
          retention-days: 90

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                 # EL gate: sin integración y e2e verdes, ni se pide aprobación
    permissions:
      contents: read
    environment:
      name: production                         # ⏸ acá el workflow se pausa hasta el approve
      url: ${{ vars.URL_FRONT }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Bajar el código al runner (migraciones y smoke)
        uses: actions/checkout@v7

      - name: Aplicar migraciones a la base de PROD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes prisma@5.21.1 migrate deploy --schema prisma/schema.prisma

      # Entre la pausa y la aprobación main se puede mover: el imgURL fija la imagen aprobada.
      # Es la MISMA etiqueta sha-<commit> que se desplegó y verificó en QA: nada se reconstruye.
      - name: Desplegar en PROD la MISMA imagen que verificó QA (backend + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          IMG_API="ghcr.io/valentinml525/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/valentinml525/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
          COMMIT_ESPERADO: ${{ github.sha }}
        run: bash .github/scripts/smoke.sh
