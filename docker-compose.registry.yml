services:
  reservas-db:
    image: postgres:16.2
    container_name: reservas-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservas-backend:
    image: ghcr.io/valentinml525/reservas-backend:v0.1.0
    container_name: reservas-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - GEO_API_KEY=${GEO_API_KEY}
      - PORT=4000
    depends_on:
      reservas-db:
        condition: service_healthy

  reservas-frontend:
    image: ghcr.io/valentinml525/reservas-frontend:v0.1.0
    container_name: reservas-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - BACKEND_URL=http://reservas-backend:4000
      - PORT=3000
    depends_on:
      - reservas-backend

volumes:
  postgres-data:
